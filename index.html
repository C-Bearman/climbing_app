<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1D9E75" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Climbing App" />
  <title>Climbing App</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <style>
    /* ============================================================
       RESET & ROOT VARIABLES
       Like declaring constants at the top of a Python script.
       Everything references these so you only change a value once.
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #1D9E75;
      --green-dark: #0F6E56;
      --green-light: #E1F5EE;
      --amber: #BA7517;
      --red: #A32D2D;
      --bg: #F5F5F2;
      --surface: #FFFFFF;
      --surface2: #F1F0EC;
      --border: rgba(0,0,0,0.08);
      --border-med: rgba(0,0,0,0.13);
      --text: #1A1A18;
      --text2: #6B6B66;
      --text3: #9B9B96;
      --radius: 14px;
      --radius-sm: 8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Dark mode — swaps colours automatically based on phone setting */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111110;
        --surface: #1C1C1A;
        --surface2: #252523;
        --border: rgba(255,255,255,0.08);
        --border-med: rgba(255,255,255,0.13);
        --text: #F0EFEA;
        --text2: #9B9B96;
        --text3: #6B6B66;
        --green-light: #0A2E22;
      }
    }

    html, body {
      height: 100%;
      font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: calc(16px + var(--safe-bottom));
    }

    /* ── Header — sticky so it stays visible when scrolling ── */
    .header {
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      padding: calc(16px + var(--safe-top)) 20px 14px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .app-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    .app-title em { color: var(--green); font-style: normal; }

    .date-badge {
      font-size: 12px; color: var(--text2);
      background: var(--surface2); border: 0.5px solid var(--border);
      border-radius: 20px; padding: 4px 10px;
      cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      -webkit-tap-highlight-color: transparent;
    }
    .date-badge svg { width: 11px; height: 11px; stroke: var(--text3); }

    .header-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
    .week-tag { font-size: 12px; color: var(--text2); }
    .streak-dots { display: flex; gap: 4px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-med); transition: background 0.2s; }
    .dot.on { background: var(--green); }
    .dot.today-empty { background: var(--border-med); box-shadow: 0 0 0 1.5px var(--green); }

    /* ── Date picker panel — hidden until date badge is tapped ── */
    .date-picker-panel {
      display: none;
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      padding: 12px 20px;
      align-items: center;
      gap: 10px;
    }
    .date-picker-panel.open { display: flex; }
    .date-picker-panel label { font-size: 13px; color: var(--text2); white-space: nowrap; }

    input[type=date] {
      flex: 1; padding: 8px 12px; font-size: 14px;
      color: var(--text); background: var(--surface2);
      border: 0.5px solid var(--border-med);
      border-radius: var(--radius-sm); outline: none; font-family: inherit;
    }
    input[type=date]:focus { border-color: var(--green); }

    .date-confirm-btn {
      padding: 8px 14px; background: var(--green); color: white;
      border: none; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }

    /* ── Section cards ── */
    .section {
      background: var(--surface);
      border-radius: var(--radius);
      border: 0.5px solid var(--border);
      padding: 16px;
      margin: 10px 14px 0;
    }
    .section-head {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--text3);
      display: flex; align-items: center; gap: 5px;
      margin-bottom: 14px;
    }
    .section-head svg { width: 13px; height: 13px; stroke: var(--text3); }

    /* ── Climbing toggle buttons ── */
    .climb-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cbtn {
      padding: 11px 8px; border-radius: var(--radius-sm);
      border: 0.5px solid var(--border-med);
      background: var(--surface2); color: var(--text2);
      font-size: 14px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.15s; -webkit-tap-highlight-color: transparent;
    }
    .cbtn svg { width: 16px; height: 16px; stroke: currentColor; }
    .cbtn.sel-yes { background: var(--green-light); border-color: var(--green); color: var(--green-dark); }
    .cbtn.sel-no  { background: var(--surface2); border-color: var(--border-med); color: var(--text); }
    .cbtn:active  { transform: scale(0.97); }

    /* ============================================================
       SESSION DETAILS PANEL (NEW)
       This block is hidden by default and only shown when the
       user selects "Climbing". It uses a CSS transition on
       max-height to animate smoothly open/closed — a common
       technique for accordion-style reveals.
       max-height: 0 = collapsed, max-height: 500px = expanded.
       overflow: hidden prevents content showing during collapse.
    ============================================================ */
    .session-details {
      max-height: 0;
      overflow: hidden;
      /* Animate the height change over 0.3 seconds */
      transition: max-height 0.3s ease, opacity 0.3s ease, margin-top 0.3s ease;
      opacity: 0;
      margin-top: 0;
    }
    .session-details.open {
      max-height: 500px;   /* large enough to fit all content */
      opacity: 1;
      margin-top: 14px;    /* adds breathing room below the toggle buttons */
    }

    /* Thin divider line above the session details when open */
    .session-divider {
      border: none;
      border-top: 0.5px solid var(--border);
      margin-bottom: 14px;
    }

    /* ============================================================
       STRETCHING DETAILS PANEL
       Same accordion pattern as session-details — hidden by default,
       expands smoothly when "Yes" is tapped on the stretch toggle.
    ============================================================ */

    /* ── Slider fields ── */
    .field { margin-bottom: 15px; }
    .field:last-child { margin-bottom: 0; }
    .field-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .field-name { font-size: 14px; color: var(--text); }
    .field-val { font-size: 15px; font-weight: 600; color: var(--green); }

    input[type=range] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 4px; border-radius: 2px;
      background: var(--surface2); outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--green); border: 3px solid var(--surface);
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    input[type=range]::-moz-range-thumb {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--green); border: 3px solid var(--surface);
      box-shadow: 0 1px 4px rgba(0,0,0,0.2); cursor: pointer;
    }

    /* Energy sliders: coloured filled track */
    .energy-track { position: relative; }
    .energy-track input[type=range] {
      background: linear-gradient(to right, var(--green) 0%, var(--green) var(--pct,50%), var(--surface2) var(--pct,50%));
    }

    /* ── Number inputs ── */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .input-wrap { position: relative; }
    .input-wrap input[type=number] {
      width: 100%; padding: 10px 36px 10px 12px;
      font-size: 15px; color: var(--text);
      background: var(--surface2); border: 0.5px solid var(--border-med);
      border-radius: var(--radius-sm); outline: none; -webkit-appearance: none;
    }
    .input-wrap input[type=number]:focus { border-color: var(--green); box-shadow: 0 0 0 2px rgba(29,158,117,0.15); }
    .input-wrap .unit { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--text3); pointer-events: none; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

    /* ── Textarea ── */
    textarea {
      width: 100%; min-height: 70px; resize: none;
      padding: 11px 13px; font-size: 15px; line-height: 1.5;
      color: var(--text); background: var(--surface2);
      border: 0.5px solid var(--border-med);
      border-radius: var(--radius-sm); outline: none; font-family: inherit;
    }
    textarea:focus { border-color: var(--green); box-shadow: 0 0 0 2px rgba(29,158,117,0.15); }
    textarea::placeholder { color: var(--text3); }

    .opt-tag {
      font-size: 10px; font-weight: 500; letter-spacing: 0.04em;
      color: var(--text3); background: var(--surface2);
      border: 0.5px solid var(--border); border-radius: 4px;
      padding: 2px 5px; margin-left: 6px;
    }

    /* ── Save button & toast ── */
    .save-wrap { padding: 14px 14px 0; }
    .save-btn {
      width: 100%; padding: 15px;
      background: var(--green); color: white;
      border: none; border-radius: var(--radius);
      font-size: 16px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, transform 0.1s;
    }
    .save-btn:active { background: var(--green-dark); transform: scale(0.98); }
    .save-btn svg { width: 18px; height: 18px; stroke: white; }

    .toast {
      text-align: center; font-size: 13px; color: var(--green);
      height: 0; overflow: hidden; transition: height 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .toast.show { height: 32px; margin-top: 8px; }
    .toast svg { width: 14px; height: 14px; stroke: var(--green); }

    /* ── History panel ── */
    .hist-toggle-wrap { text-align: center; padding: 14px 0 4px; }
    .hist-toggle {
      background: none; border: none; cursor: pointer;
      font-size: 13px; color: var(--text2);
      display: inline-flex; align-items: center; gap: 5px;
      -webkit-tap-highlight-color: transparent;
    }
    .hist-toggle svg { width: 14px; height: 14px; stroke: var(--text2); }
    .hist-panel { display: none; padding: 4px 14px 0; }

    .export-btn {
      width: 100%; padding: 11px; margin-bottom: 10px;
      background: var(--surface); border: 0.5px solid var(--border-med);
      border-radius: var(--radius-sm); font-size: 14px; color: var(--text2);
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .export-btn svg { width: 15px; height: 15px; stroke: var(--text2); }

    .entry-card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 8px;
    }
    .entry-date { font-size: 12px; color: var(--text3); margin-bottom: 7px; display: flex; align-items: center; gap: 5px; }
    .entry-stats { display: flex; flex-wrap: wrap; gap: 8px 14px; }
    .estat { font-size: 13px; color: var(--text2); }
    .estat b { color: var(--text); font-weight: 600; }
    .entry-note { font-size: 13px; color: var(--text2); margin-top: 7px; font-style: italic; border-top: 0.5px solid var(--border); padding-top: 7px; }
    .empty-hist { font-size: 13px; color: var(--text3); text-align: center; padding: 20px 0; }

    /* ── Past date warning banner ── */
    .past-date-banner {
      display: none;
      margin: 10px 14px 0;
      padding: 10px 14px;
      background: #FAEEDA;
      border: 0.5px solid var(--amber);
      border-radius: var(--radius-sm);
      font-size: 13px; color: var(--amber);
      align-items: center; gap: 8px;
    }
    .past-date-banner.show { display: flex; }
    .past-date-banner svg { width: 14px; height: 14px; stroke: var(--amber); flex-shrink: 0; }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="header-top">
      <div class="app-title">Climbing <em>App</em></div>
      <div class="date-badge" id="date-badge" onclick="toggleDatePicker()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        <span id="date-label"></span>
      </div>
    </div>
    <div class="header-meta">
      <div class="week-tag" id="week-tag"></div>
      <div class="streak-dots" id="streak-dots"></div>
    </div>
  </header>

  <!-- Date picker panel -->
  <div class="date-picker-panel" id="date-picker-panel">
    <label for="date-input">Logging for:</label>
    <input type="date" id="date-input" onchange="previewDate(this.value)" />
    <button class="date-confirm-btn" onclick="confirmDate()">Set date</button>
  </div>

  <!-- Past date warning banner -->
  <div class="past-date-banner" id="past-banner">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="past-banner-text"></span>
  </div>

  <!--
    CLIMBING TODAY? SECTION
    This card now contains three things:
      1. The yes/no toggle (unchanged)
      2. The session details panel — hidden until "Climbing" is tapped
         (session rating slider, mobility checkbox, session notes)
    All three live in one card so the expanding content feels
    like it naturally belongs to the climbing choice.
  -->
  <div class="section">
    <div class="section-head">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      Climbing today?
    </div>

    <!-- Toggle buttons — unchanged from before -->
    <div class="climb-btns">
      <button class="cbtn" id="btn-yes" onclick="setClimb('yes')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2C8 2 4 6 4 10c0 6 8 12 8 12s8-6 8-12c0-4-4-8-8-8z"/><circle cx="12" cy="10" r="2"/></svg>
        Climbing
      </button>
      <button class="cbtn" id="btn-no" onclick="setClimb('no')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 9V7a2 2 0 00-2-2H4a2 2 0 00-2 2v6a2 2 0 002 2h8"/><path d="M16 14l2 2 4-4"/></svg>
        Rest day
      </button>
    </div>

    <!--
      SESSION DETAILS — NEW
      Hidden by default. setClimb('yes') adds the 'open' class
      which triggers the CSS transition to expand it smoothly.
      setClimb('no') removes 'open' and it collapses back.
    -->
    <div class="session-details" id="session-details">
      <hr class="session-divider">

      <!-- Session rating slider — same pattern as energy sliders -->
      <div class="field">
        <div class="field-top">
          <span class="field-name">Session rating</span>
          <span class="field-val" id="sess-val">5</span>
        </div>
        <div class="energy-track" id="sess-track">
          <input type="range" id="sess" min="1" max="10" step="1" value="5"
                 oninput="updEnergy('sess', this.value)">
        </div>
      </div>

      <!-- Session notes — specific to this climbing session -->
      <div style="margin-top: 14px;">
        <div class="field-top" style="margin-bottom: 8px;">
          <span class="field-name" style="font-size:13px; color: var(--text2);">Session notes</span>
        </div>
        <textarea id="sess-notes" placeholder="e.g. 'Crimps & Fingers felt good, felt weak on powerful moves'"></textarea>
      </div>
    </div>
  </div>

  <!--
    STRETCHING / MOBILITY SECTION — NEW, always visible
    Sits between climbing and recovery so it's relevant on both
    climbing days and rest days. Same yes/no toggle pattern as
    the climbing card. Tapping "Yes" reveals the flexibility
    rating slider using the same accordion CSS as session-details.
  -->
  <div class="section">
    <div class="section-head">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M18 3a3 3 0 00-3 3v12a3 3 0 003 3 3 3 0 003-3 3 3 0 00-3-3H6a3 3 0 00-3 3 3 3 0 003 3 3 3 0 003-3V6a3 3 0 00-3-3 3 3 0 00-3 3 3 3 0 003 3h12a3 3 0 003-3 3 3 0 00-3-3z"/></svg>
      Stretching / Mobility
    </div>

    <!-- Yes/No toggle — identical pattern to the climbing toggle -->
    <div class="climb-btns">
      <button class="cbtn" id="stretch-yes" onclick="setStretch('yes')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
        Yes
      </button>
      <button class="cbtn" id="stretch-no" onclick="setStretch('no')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        No
      </button>
    </div>

    <!--
      Flexibility rating — only shown when stretching = yes.
      Uses the same session-details accordion CSS class and
      the same updEnergy() function for colour-coded display.
    -->
    <div class="session-details" id="stretch-details">
      <hr class="session-divider">
      <div class="field">
        <div class="field-top">
          <span class="field-name">Flexibility rating</span>
          <span class="field-val" id="flex-val">5</span>
        </div>
        <div class="energy-track" id="flex-track">
          <input type="range" id="flex" min="1" max="10" step="1" value="5"
                 oninput="updEnergy('flex', this.value)">
        </div>
      </div>
    </div>
  </div>

  <!-- Recovery -->
  <div class="section">
    <div class="section-head">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 3a6 6 0 009 9 9 9 0 11-9-9z"/></svg>
      Recovery
    </div>
    <div class="field">
      <div class="field-top">
        <span class="field-name">Sleep</span>
        <span class="field-val" id="sleep-val">7h</span>
      </div>
      <input type="range" id="sleep" min="2" max="12" step="0.5" value="7" oninput="updSleep(this.value)">
    </div>
    <div class="field">
      <div class="field-top">
        <span class="field-name">Water</span>
        <span class="field-val" id="water-val">2.0L</span>
      </div>
      <input type="range" id="water" min="0" max="5" step="0.25" value="2" oninput="updWater(this.value)">
    </div>
  </div>

  <!-- Energy -->
  <div class="section">
    <div class="section-head">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Energy
    </div>
    <div class="field">
      <div class="field-top">
        <span class="field-name">Physical</span>
        <span class="field-val" id="phys-val">5</span>
      </div>
      <div class="energy-track" id="phys-track">
        <input type="range" id="phys" min="1" max="10" step="1" value="5" oninput="updEnergy('phys',this.value)">
      </div>
    </div>
    <div class="field">
      <div class="field-top">
        <span class="field-name">Mental</span>
        <span class="field-val" id="ment-val">5</span>
      </div>
      <div class="energy-track" id="ment-track">
        <input type="range" id="ment" min="1" max="10" step="1" value="5" oninput="updEnergy('ment',this.value)">
      </div>
    </div>
  </div>

  <!-- Nutrition (optional) -->
  <div class="section">
    <div class="section-head">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2a10 10 0 100 20A10 10 0 0012 2z"/><path d="M12 6v6l4 2"/></svg>
      Nutrition <span class="opt-tag">optional</span>
    </div>
    <div class="two-col">
      <div>
        <div class="field-top" style="margin-bottom:6px;"><span class="field-name" style="font-size:13px;">Calories</span></div>
        <div class="input-wrap">
          <input type="number" id="cals" placeholder="2200" min="0" max="9999">
          <span class="unit">kcal</span>
        </div>
      </div>
      <div>
        <div class="field-top" style="margin-bottom:6px;"><span class="field-name" style="font-size:13px;">Protein</span></div>
        <div class="input-wrap">
          <input type="number" id="prot" placeholder="150" min="0" max="999">
          <span class="unit">g</span>
        </div>
      </div>
    </div>
  </div>

  <!-- General notes — day/life notes, separate from session notes above -->
  <div class="section">
    <div class="section-head">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      General notes
    </div>
    <textarea id="notes" placeholder="e.g. 'slept awfully, work stress' or 'feeling good this week'"></textarea>
  </div>

  <!-- Save -->
  <div class="save-wrap">
    <button class="save-btn" onclick="saveEntry()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Log entry
    </button>
    <div class="toast" id="toast">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="toast-msg">Entry saved!</span>
    </div>
  </div>

  <!--
    DATA MANAGEMENT SECTION — NEW
    Contains filename setting, export and import.
    Sits above the history log so it's easy to find.
  -->
  <div class="section" style="margin-top:14px;">
    <div class="section-head">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
      Data
    </div>

    <!--
      Filename input — user sets their master CSV filename once.
      Stored in localStorage so it persists between sessions.
      The .csv extension is appended automatically on export.
    -->
    <div class="field-top" style="margin-bottom:6px;">
      <span class="field-name" style="font-size:13px;">File name</span>
    </div>
    <div class="input-wrap" style="margin-bottom:12px;">
      <input type="text" id="csv-filename" placeholder="climbing_data"
             style="width:100%;padding:10px 46px 10px 12px;font-size:15px;
                    color:var(--text);background:var(--surface2);
                    border:0.5px solid var(--border-med);
                    border-radius:var(--radius-sm);outline:none;font-family:inherit;"
             oninput="saveFilename(this.value)">
      <span class="unit">.csv</span>
    </div>

    <!-- Export buttons — main export + optional "save as new" -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
      <!--
        Main export — uses the saved filename, overwrites the previous file.
        This is the one you'll tap most often.
      -->
      <button class="cbtn sel-yes" style="padding:11px 8px;" onclick="exportCSV(false)">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" style="width:15px;height:15px;stroke:currentColor;">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Export
      </button>
      <!--
        Save as new — prompts for a different filename so you can take
        a named snapshot (e.g. "week_6_checkpoint") without changing
        your default filename.
      -->
      <button class="cbtn" style="padding:11px 8px;" onclick="exportCSV(true)">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" style="width:15px;height:15px;stroke:currentColor;">
          <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Save as new
      </button>
    </div>

    <!--
      Import section — hidden file input triggered by the visible button.
      <input type="file"> is invisible; the button calls click() on it.
      On mobile this opens the file picker so you can select your CSV.
      After selection, importCSV() fires and parses the file.
    -->
    <input type="file" id="csv-file-input" accept=".csv,text/csv,text/plain,*/*"
           style="display:none" onchange="importCSV(this)">
    <button class="cbtn" style="width:100%;padding:11px;" onclick="document.getElementById('csv-file-input').click()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" style="width:15px;height:15px;stroke:currentColor;">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/><!-- arrow up -->
        <polyline points="17 10 12 5 7 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Import CSV
    </button>

    <!-- Import result banner — shown briefly after a successful import -->
    <div class="toast" id="import-toast" style="margin-top:8px;">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" style="width:14px;height:14px;stroke:var(--green);"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="import-msg"></span>
    </div>
  </div>

  <!-- History toggle -->
  <div class="hist-toggle-wrap">
    <button class="hist-toggle" onclick="toggleHist()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
      <span id="hist-lbl">Show log history</span>
    </button>
  </div>

  <!-- History panel -->
  <div class="hist-panel" id="hist-panel">
    <div id="hist-list"></div>
  </div>

</div>

<script>
  /* ── State variables ── */
  const STORAGE_KEY = 'climbing_app_v1';
  let climbVal     = null;
  let selectedDate = todayStr();

  /* ── todayStr(): returns today as YYYY-MM-DD ── */
  function todayStr() {
    return new Date().toISOString().split('T')[0];
  }

  /* ── formatDisplayDate(): YYYY-MM-DD → "Fri 6 Jun" ── */
  function formatDisplayDate(dateStr) {
    const d = new Date(dateStr + 'T12:00:00'); // noon avoids timezone edge cases
    return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  }

  /* ── getEntries() / saveEntries(): read/write localStorage ── */
  function getEntries() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch(e) { return []; }
  }
  function saveEntries(arr) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  }

  /* ── Date picker ── */
  function toggleDatePicker() {
    const panel = document.getElementById('date-picker-panel');
    const isOpen = panel.classList.contains('open');
    if (isOpen) {
      panel.classList.remove('open');
    } else {
      document.getElementById('date-input').value = selectedDate;
      panel.classList.add('open');
    }
  }

  function previewDate(val) {
    if (val) document.getElementById('date-label').textContent = formatDisplayDate(val);
  }

  function confirmDate() {
    const val = document.getElementById('date-input').value;
    if (!val) return;
    selectedDate = val;
    document.getElementById('date-picker-panel').classList.remove('open');
    updateDateUI();
    prefillForm(selectedDate);
  }

  function updateDateUI() {
    const isPast = selectedDate < todayStr();
    document.getElementById('date-label').textContent = formatDisplayDate(selectedDate);
    const banner = document.getElementById('past-banner');
    if (isPast) {
      document.getElementById('past-banner-text').textContent =
        `Logging for ${formatDisplayDate(selectedDate)} — existing entry will be updated`;
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
  }

  /* ============================================================
     setClimb(val) — UPDATED
     Now also handles showing/hiding the session details panel.
     When 'yes' is selected, adds 'open' class to trigger the
     CSS max-height transition. When 'no', removes it.
  ============================================================ */
  function setClimb(val) {
    climbVal = val;
    document.getElementById('btn-yes').className = 'cbtn' + (val === 'yes' ? ' sel-yes' : '');
    document.getElementById('btn-no').className  = 'cbtn' + (val === 'no'  ? ' sel-no'  : '');

    // Show session details only on climbing days
    const details = document.getElementById('session-details');
    if (val === 'yes') {
      details.classList.add('open');
    } else {
      details.classList.remove('open');
    }
  }

  /* ============================================================
     setStretch(val)
     Same pattern as setClimb() — updates button styles and
     toggles the flexibility rating panel open/closed.
     stretchVal is a new state variable alongside climbVal.
  ============================================================ */
  let stretchVal = null; // tracks yes/no for stretching

  function setStretch(val) {
    stretchVal = val;
    document.getElementById('stretch-yes').className = 'cbtn' + (val === 'yes' ? ' sel-yes' : '');
    document.getElementById('stretch-no').className  = 'cbtn' + (val === 'no'  ? ' sel-no'  : '');

    // Show flexibility slider only when stretching was done
    const details = document.getElementById('stretch-details');
    if (val === 'yes') {
      details.classList.add('open');
    } else {
      details.classList.remove('open');
    }
  }

  /* ── Slider updates ── */
  function updSleep(v) {
    document.getElementById('sleep-val').textContent =
      parseFloat(v).toFixed(1).replace('.0','') + 'h';
  }

  function updWater(v) {
    document.getElementById('water-val').textContent =
      parseFloat(v).toFixed(2).replace(/0$/,'').replace(/\.$/,'') + 'L';
  }

  /*
    updEnergy(id, v) — UPDATED
    Now also handles the session rating slider ('sess') since it
    shares the same colour-coded behaviour as physical/mental energy.
    Reusable for any slider that needs green/amber/red colouring.
  */
  function updEnergy(id, v) {
    const n   = parseInt(v);
    const col = n >= 7 ? 'var(--green)' : n >= 4 ? 'var(--amber)' : 'var(--red)';
    document.getElementById(id+'-val').textContent = n;
    document.getElementById(id+'-val').style.color = col;
    const pct = ((n - 1) / 9 * 100).toFixed(1) + '%';
    document.getElementById(id+'-track').querySelector('input').style.background =
      `linear-gradient(to right, ${col} 0%, ${col} ${pct}, var(--surface2) ${pct})`;
  }

  /* ============================================================
     prefillForm(dateStr) — UPDATED
     Now also resets and restores the three new fields:
     session rating, mobility checkbox, and session notes.
  ============================================================ */
  function prefillForm(dateStr) {
    const prev = getEntries().find(e => e.date === dateStr);

    // Reset all fields to defaults
    document.getElementById('sleep').value = 7;  updSleep(7);
    document.getElementById('water').value = 2;  updWater(2);
    document.getElementById('phys').value  = 5;  updEnergy('phys', 5);
    document.getElementById('ment').value  = 5;  updEnergy('ment', 5);
    document.getElementById('sess').value  = 5;  updEnergy('sess', 5); // NEW
    document.getElementById('cals').value  = '';
    document.getElementById('prot').value  = '';
    document.getElementById('notes').value = '';
    document.getElementById('sess-notes').value = '';
    climbVal   = null;
    stretchVal = null;
    document.getElementById('btn-yes').className    = 'cbtn';
    document.getElementById('btn-no').className     = 'cbtn';
    document.getElementById('stretch-yes').className = 'cbtn';
    document.getElementById('stretch-no').className  = 'cbtn';
    document.getElementById('session-details').classList.remove('open');
    document.getElementById('stretch-details').classList.remove('open');
    // Reset flexibility slider
    document.getElementById('flex').value = 5; updEnergy('flex', 5);

    // Overwrite with saved values if an entry exists for this date
    if (prev) {
      document.getElementById('sleep').value = prev.sleep; updSleep(prev.sleep);
      document.getElementById('water').value = prev.water; updWater(prev.water);
      document.getElementById('phys').value  = prev.physical; updEnergy('phys', prev.physical);
      document.getElementById('ment').value  = prev.mental;   updEnergy('ment', prev.mental);
      if (prev.calories)  document.getElementById('cals').value = prev.calories;
      if (prev.protein)   document.getElementById('prot').value = prev.protein;
      if (prev.notes)     document.getElementById('notes').value = prev.notes;
      // Restore session fields
      if (prev.sess_rating) {
        document.getElementById('sess').value = prev.sess_rating;
        updEnergy('sess', prev.sess_rating);
      }
      if (prev.sess_notes) document.getElementById('sess-notes').value = prev.sess_notes;
      // Restore climbing toggle (also opens/closes session panel)
      if (prev.climbing) setClimb(prev.climbing);
      // Restore stretching toggle (also opens/closes flex panel)
      if (prev.stretching) setStretch(prev.stretching);
      if (prev.flex_rating) {
        document.getElementById('flex').value = prev.flex_rating;
        updEnergy('flex', prev.flex_rating);
      }
    }
  }

  /* ============================================================
     saveEntry() — UPDATED
     Three new fields added to the entry object:
       sess_rating: the 1-10 session score (null on rest days)
       mobility: boolean — did you stretch? (null on rest days)
       sess_notes: session-specific notes (null on rest days)
     These are only saved when climbing = 'yes', otherwise null.
  ============================================================ */
  function saveEntry() {
    const isClimbing   = climbVal   === 'yes';
    const isStretching = stretchVal === 'yes';

    const entry = {
      date:        selectedDate,
      climbing:    climbVal,
      sleep:       parseFloat(document.getElementById('sleep').value),
      water:       parseFloat(document.getElementById('water').value),
      physical:    parseInt(document.getElementById('phys').value),
      mental:      parseInt(document.getElementById('ment').value),
      calories:    document.getElementById('cals').value || null,
      protein:     document.getElementById('prot').value || null,
      notes:       document.getElementById('notes').value.trim() || null,
      // Session fields — only populated on climbing days
      sess_rating: isClimbing   ? parseInt(document.getElementById('sess').value) : null,
      sess_notes:  isClimbing   ? (document.getElementById('sess-notes').value.trim() || null) : null,
      // Stretching fields — populated on any day stretching was done
      stretching:  stretchVal,
      flex_rating: isStretching ? parseInt(document.getElementById('flex').value) : null
    };

    const arr = getEntries().filter(e => e.date !== selectedDate);
    arr.unshift(entry);
    arr.sort((a, b) => b.date.localeCompare(a.date));
    saveEntries(arr);

    const toastMsg = document.getElementById('toast-msg');
    toastMsg.textContent = selectedDate === todayStr()
      ? 'Entry saved!'
      : `Entry saved for ${formatDisplayDate(selectedDate)}`;
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);

    renderStreak();
    if (document.getElementById('hist-panel').style.display === 'block') renderHist();
  }

  /* ── renderStreak(): draws the 12 dots in the header ── */
  function renderStreak() {
    const logged = new Set(getEntries().map(e => e.date));
    const bar    = document.getElementById('streak-dots');
    const today  = todayStr();
    bar.innerHTML = '';
    for (let i = 11; i >= 0; i--) {
      const d  = new Date(); d.setDate(d.getDate() - i);
      const ds = d.toISOString().split('T')[0];
      const dot = document.createElement('div');
      dot.title = ds;
      if      (logged.has(ds)) dot.className = 'dot on';
      else if (ds === today)   dot.className = 'dot today-empty';
      else                     dot.className = 'dot';
      bar.appendChild(dot);
    }
  }

  /* ── toggleHist() / renderHist() ── */
  function toggleHist() {
    const p    = document.getElementById('hist-panel');
    const open = p.style.display === 'block';
    p.style.display = open ? 'none' : 'block';
    document.getElementById('hist-lbl').textContent = open ? 'Show log history' : 'Hide log history';
    if (!open) renderHist();
  }

  /*
    renderHist() — UPDATED
    Now also displays session rating, mobility, and session notes
    in the history cards when they exist.
  */
  function renderHist() {
    const entries = getEntries();
    const list    = document.getElementById('hist-list');
    if (!entries.length) {
      list.innerHTML = '<p class="empty-hist">No entries yet — log today first!</p>';
      return;
    }
    list.innerHTML = entries.slice(0, 30).map(e => {
      const icon      = e.climbing  === 'yes' ? '🧗' : e.climbing === 'no' ? '💤' : '';
      const stretchStr = e.stretching === 'yes' ? ' · 🧘 stretched' : '';
      return `<div class="entry-card">
        <div class="entry-date">${icon} ${formatDisplayDate(e.date)}${stretchStr}</div>
        <div class="entry-stats">
          <div class="estat">Sleep <b>${e.sleep}h</b></div>
          <div class="estat">Water <b>${e.water}L</b></div>
          <div class="estat">Physical <b>${e.physical}/10</b></div>
          <div class="estat">Mental <b>${e.mental}/10</b></div>
          ${e.sess_rating  ? `<div class="estat">Session <b>${e.sess_rating}/10</b></div>` : ''}
          ${e.flex_rating  ? `<div class="estat">Flexibility <b>${e.flex_rating}/10</b></div>` : ''}
          ${e.calories     ? `<div class="estat">Cals <b>${e.calories}</b></div>` : ''}
          ${e.protein      ? `<div class="estat">Protein <b>${e.protein}g</b></div>` : ''}
        </div>
        ${e.sess_notes ? `<div class="entry-note">🧗 "${e.sess_notes}"</div>` : ''}
        ${e.notes      ? `<div class="entry-note">📋 "${e.notes}"</div>` : ''}
      </div>`;
    }).join('');
  }

  /* ============================================================
     exportCSV() — UPDATED
     Three new columns added to the CSV:
       session_rating, mobility, session_notes
     These will be empty on rest days, populated on climb days.
     This keeps the CSV format consistent so every row has the
     same columns — important for your coach's spreadsheet.
  ============================================================ */


  /* ============================================================
     FILENAME MANAGEMENT
     The chosen filename is saved to localStorage under 'csv_filename'
     so it persists between sessions. Defaults to 'climbing_data'.
  ============================================================ */
  function saveFilename(val) {
    const clean = val.trim().replace(/\.csv$/i, '') || 'climbing_data';
    localStorage.setItem('csv_filename', clean);
  }
  function getFilename() {
    return localStorage.getItem('csv_filename') || 'climbing_data';
  }

  /* ============================================================
     getEarliestDate()
     Finds the earliest logged date — used to auto-calculate
     the training start. Returns null if no entries exist.
  ============================================================ */
  function getEarliestDate() {
    const entries = getEntries();
    if (!entries.length) return null;
    return entries[entries.length - 1].date; // sorted newest-first, so last = earliest
  }

  /* ============================================================
     exportCSV(saveAs)
     saveAs=false → export using saved filename (main workflow)
     saveAs=true  → prompt for a snapshot filename, keeps default
  ============================================================ */
  function exportCSV(saveAs = false) {
    const entries = getEntries();
    if (!entries.length) { alert('No entries to export yet!'); return; }

    let filename = getFilename();
    if (saveAs) {
      const custom = prompt('Save as (without .csv):', filename);
      if (!custom) return;
      filename = custom.trim().replace(/\.csv$/i, '') || filename;
    }

    const headers = [
      'date','climbing','sleep_h','water_L',
      'physical_energy','mental_energy',
      'session_rating','session_notes',
      'stretching','flexibility_rating',
      'calories_kcal','protein_g','general_notes'
    ];
    const rows = entries.map(e => [
      e.date, e.climbing||'', e.sleep, e.water,
      e.physical, e.mental,
      e.sess_rating||'', '"' + (e.sess_notes||'').replace(/"/g,"'") + '"',
      e.stretching||'', e.flex_rating||'',
      e.calories||'', e.protein||'',
      '"' + (e.notes||'').replace(/"/g,"'") + '"'
    ]);

    const csv  = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename + '.csv';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  /* ============================================================
     importCSV(input)
     Reads a CSV file, parses rows into entry objects, and merges
     into localStorage. CSV wins on any date conflict.
     FileReader reads the file asynchronously — the onload
     callback fires when the file content is ready.
  ============================================================ */
  function importCSV(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const lines = e.target.result.trim().split('\n');
      if (lines.length < 2) { alert('CSV appears to be empty.'); return; }
      const headers  = lines[0].split(',').map(h => h.trim());
      const imported = [];

      for (let i = 1; i < lines.length; i++) {
        const cols = parseCSVLine(lines[i]);
        if (cols.length < 2) continue;
        const get = col => {
          const idx = headers.indexOf(col);
          return idx >= 0 ? (cols[idx]||'').replace(/^"|"$/g,'').trim() : '';
        };
        const entry = {
          date:        get('date'),
          climbing:    get('climbing')||null,
          sleep:       parseFloat(get('sleep_h'))||7,
          water:       parseFloat(get('water_L'))||2,
          physical:    parseInt(get('physical_energy'))||5,
          mental:      parseInt(get('mental_energy'))||5,
          sess_rating: parseInt(get('session_rating'))||null,
          sess_notes:  get('session_notes')||null,
          stretching:  get('stretching')||null,
          flex_rating: parseInt(get('flexibility_rating'))||null,
          calories:    get('calories_kcal')||null,
          protein:     get('protein_g')||null,
          notes:       get('general_notes')||null,
        };
        if (isNaN(entry.sess_rating)) entry.sess_rating = null;
        if (isNaN(entry.flex_rating)) entry.flex_rating = null;
        if (entry.date) imported.push(entry);
      }

      if (!imported.length) { alert('No valid entries found in CSV.'); return; }

      // Merge: CSV wins on conflicts
      const existing     = getEntries();
      const importedDates = new Set(imported.map(e => e.date));
      const merged = [...existing.filter(e => !importedDates.has(e.date)), ...imported];
      merged.sort((a, b) => b.date.localeCompare(a.date));
      saveEntries(merged);
      input.value = '';

      const msg = document.getElementById('import-msg');
      const toast = document.getElementById('import-toast');
      msg.textContent = `Imported ${imported.length} entries — ${merged.length} total`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);

      renderStreak();
      updateWeekCounter();
      if (document.getElementById('hist-panel').style.display === 'block') renderHist();
    };
    reader.readAsText(file);
  }

  /* ============================================================
     parseCSVLine(line)
     Splits a CSV line by commas but respects quoted fields —
     so commas inside notes don't break the parse.
  ============================================================ */
  function parseCSVLine(line) {
    const result = []; let current = ''; let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQuotes = !inQuotes; }
      else if (ch === ',' && !inQuotes) { result.push(current); current = ''; }
      else { current += ch; }
    }
    result.push(current);
    return result;
  }

  /* ============================================================
     updateWeekCounter()
     Calculates week number from earliest entry date.
     Hides the counter if no entries logged yet.
  ============================================================ */
  function updateWeekCounter() {
    const earliest = getEarliestDate();
    const weekTag  = document.getElementById('week-tag');
    if (!earliest) { weekTag.textContent = ''; return; }
    const START = new Date(earliest + 'T12:00:00');
    const diff  = Math.floor((new Date() - START) / (1000*60*60*24*7));
    weekTag.textContent = `Week ${Math.max(1, diff + 1)}`;
  }

  /* ── init(): runs on page load ── */
  function init() {
    document.getElementById('date-label').textContent = formatDisplayDate(selectedDate);
    document.getElementById('csv-filename').value = getFilename();
    updateWeekCounter();
    renderStreak();
    prefillForm(selectedDate);
    updEnergy('phys', document.getElementById('phys').value);
    updEnergy('ment', document.getElementById('ment').value);
    updEnergy('sess', document.getElementById('sess').value);
    updEnergy('flex', document.getElementById('flex').value);
  }

  init();
</script>
