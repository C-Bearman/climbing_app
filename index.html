<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1D9E75" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Climbing App" />
  <title>Climbing App</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <style>
    /* ============================================================
       RESET & ROOT VARIABLES
       Like declaring constants at the top of a Python script.
       Everything that follows references these variables so you
       only ever need to change a colour/size in one place.
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #1D9E75;
      --green-dark: #0F6E56;
      --green-light: #E1F5EE;
      --amber: #BA7517;
      --red: #A32D2D;
      --bg: #F5F5F2;
      --surface: #FFFFFF;
      --surface2: #F1F0EC;
      --border: rgba(0,0,0,0.08);
      --border-med: rgba(0,0,0,0.13);
      --text: #1A1A18;
      --text2: #6B6B66;
      --text3: #9B9B96;
      --radius: 14px;
      --radius-sm: 8px;
      /* safe-area-inset accounts for the Pixel's notch/nav bar */
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Dark mode — swaps surface colours automatically based on phone setting */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111110;
        --surface: #1C1C1A;
        --surface2: #252523;
        --border: rgba(255,255,255,0.08);
        --border-med: rgba(255,255,255,0.13);
        --text: #F0EFEA;
        --text2: #9B9B96;
        --text3: #6B6B66;
        --green-light: #0A2E22;
      }
    }

    html, body {
      height: 100%;
      font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── App wrapper: centres content and caps width for mobile ── */
    .app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: calc(16px + var(--safe-bottom));
    }

    /* ============================================================
       HEADER
       Sticky so it stays at the top when you scroll.
    ============================================================ */
    .header {
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      padding: calc(16px + var(--safe-top)) 20px 14px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .app-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    .app-title em { color: var(--green); font-style: normal; }

    /* ── NEW: date badge is now a clickable button to open the date picker ── */
    .date-badge {
      font-size: 12px; color: var(--text2);
      background: var(--surface2); border: 0.5px solid var(--border);
      border-radius: 20px; padding: 4px 10px;
      cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      -webkit-tap-highlight-color: transparent;
    }
    .date-badge svg { width: 11px; height: 11px; stroke: var(--text3); }

    .header-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
    .week-tag { font-size: 12px; color: var(--text2); }
    .streak-dots { display: flex; gap: 4px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-med); transition: background 0.2s; }
    .dot.on { background: var(--green); }
    .dot.today-empty { background: var(--border-med); box-shadow: 0 0 0 1.5px var(--green); }

    /* ============================================================
       DATE PICKER PANEL
       NEW: hidden by default, slides open when you tap the date badge.
       Contains a native <input type="date"> which gives you the
       phone's built-in date picker UI for free.
    ============================================================ */
    .date-picker-panel {
      display: none;                        /* hidden until toggled */
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      padding: 12px 20px;
      align-items: center;
      gap: 10px;
    }
    .date-picker-panel.open { display: flex; }
    .date-picker-panel label { font-size: 13px; color: var(--text2); white-space: nowrap; }

    /* Style the native date input to match the rest of the app */
    input[type=date] {
      flex: 1;
      padding: 8px 12px;
      font-size: 14px;
      color: var(--text);
      background: var(--surface2);
      border: 0.5px solid var(--border-med);
      border-radius: var(--radius-sm);
      outline: none;
      font-family: inherit;
    }
    input[type=date]:focus { border-color: var(--green); }

    .date-confirm-btn {
      padding: 8px 14px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* ============================================================
       SECTION CARDS
       Each card on screen is a .section div. Consistent styling
       applied once here rather than repeating on every card.
    ============================================================ */
    .section {
      background: var(--surface);
      border-radius: var(--radius);
      border: 0.5px solid var(--border);
      padding: 16px;
      margin: 10px 14px 0;
    }
    .section-head {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--text3);
      display: flex; align-items: center; gap: 5px;
      margin-bottom: 14px;
    }
    .section-head svg { width: 13px; height: 13px; stroke: var(--text3); }

    /* ── Climb toggle buttons ── */
    .climb-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cbtn {
      padding: 11px 8px; border-radius: var(--radius-sm);
      border: 0.5px solid var(--border-med);
      background: var(--surface2); color: var(--text2);
      font-size: 14px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.15s; -webkit-tap-highlight-color: transparent;
    }
    .cbtn svg { width: 16px; height: 16px; stroke: currentColor; }
    .cbtn.sel-yes { background: var(--green-light); border-color: var(--green); color: var(--green-dark); }
    .cbtn.sel-no  { background: var(--surface2); border-color: var(--border-med); color: var(--text); }
    .cbtn:active  { transform: scale(0.97); }

    /* ── Slider fields ── */
    .field { margin-bottom: 15px; }
    .field:last-child { margin-bottom: 0; }
    .field-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .field-name { font-size: 14px; color: var(--text); }
    .field-val { font-size: 15px; font-weight: 600; color: var(--green); }

    /* Range slider — removes browser default styling and applies custom look */
    input[type=range] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 4px; border-radius: 2px;
      background: var(--surface2); outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--green); border: 3px solid var(--surface);
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    input[type=range]::-moz-range-thumb {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--green); border: 3px solid var(--surface);
      box-shadow: 0 1px 4px rgba(0,0,0,0.2); cursor: pointer;
    }

    /* Energy sliders get a colour-filled track (green/amber/red) */
    .energy-track { position: relative; }
    .energy-track input[type=range] {
      background: linear-gradient(to right, var(--green) 0%, var(--green) var(--pct,50%), var(--surface2) var(--pct,50%));
    }

    /* ── Number inputs (calories, protein) ── */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .input-wrap { position: relative; }
    .input-wrap input[type=number] {
      width: 100%; padding: 10px 36px 10px 12px;
      font-size: 15px; color: var(--text);
      background: var(--surface2); border: 0.5px solid var(--border-med);
      border-radius: var(--radius-sm); outline: none;
      -webkit-appearance: none;
    }
    .input-wrap input[type=number]:focus { border-color: var(--green); box-shadow: 0 0 0 2px rgba(29,158,117,0.15); }
    .input-wrap .unit { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--text3); pointer-events: none; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

    /* ── Textarea (notes) ── */
    textarea {
      width: 100%; min-height: 80px; resize: none;
      padding: 11px 13px; font-size: 15px; line-height: 1.5;
      color: var(--text); background: var(--surface2);
      border: 0.5px solid var(--border-med);
      border-radius: var(--radius-sm); outline: none;
      font-family: inherit;
    }
    textarea:focus { border-color: var(--green); box-shadow: 0 0 0 2px rgba(29,158,117,0.15); }
    textarea::placeholder { color: var(--text3); }

    /* ── Optional label tag ── */
    .opt-tag {
      font-size: 10px; font-weight: 500; letter-spacing: 0.04em;
      color: var(--text3); background: var(--surface2);
      border: 0.5px solid var(--border); border-radius: 4px;
      padding: 2px 5px; margin-left: 6px;
    }

    /* ============================================================
       SAVE BUTTON & TOAST
       Toast = the little "Entry saved!" confirmation that appears
       briefly then disappears. Height animates from 0 to 32px.
    ============================================================ */
    .save-wrap { padding: 14px 14px 0; }
    .save-btn {
      width: 100%; padding: 15px;
      background: var(--green); color: white;
      border: none; border-radius: var(--radius);
      font-size: 16px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, transform 0.1s;
    }
    .save-btn:active { background: var(--green-dark); transform: scale(0.98); }
    .save-btn svg { width: 18px; height: 18px; stroke: white; }

    .toast {
      text-align: center; font-size: 13px; color: var(--green);
      height: 0; overflow: hidden; transition: height 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .toast.show { height: 32px; margin-top: 8px; }
    .toast svg { width: 14px; height: 14px; stroke: var(--green); }

    /* ============================================================
       HISTORY PANEL
    ============================================================ */
    .hist-toggle-wrap { text-align: center; padding: 14px 0 4px; }
    .hist-toggle {
      background: none; border: none; cursor: pointer;
      font-size: 13px; color: var(--text2);
      display: inline-flex; align-items: center; gap: 5px;
      -webkit-tap-highlight-color: transparent;
    }
    .hist-toggle svg { width: 14px; height: 14px; stroke: var(--text2); }
    .hist-panel { display: none; padding: 4px 14px 0; }

    .export-btn {
      width: 100%; padding: 11px; margin-bottom: 10px;
      background: var(--surface); border: 0.5px solid var(--border-med);
      border-radius: var(--radius-sm); font-size: 14px; color: var(--text2);
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .export-btn svg { width: 15px; height: 15px; stroke: var(--text2); }

    .entry-card {
      background: var(--surface); border: 0.5px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 8px;
    }
    .entry-date { font-size: 12px; color: var(--text3); margin-bottom: 7px; display: flex; align-items: center; gap: 5px; }
    .entry-stats { display: flex; flex-wrap: wrap; gap: 8px 14px; }
    .estat { font-size: 13px; color: var(--text2); }
    .estat b { color: var(--text); font-weight: 600; }
    .entry-note { font-size: 13px; color: var(--text2); margin-top: 7px; font-style: italic; border-top: 0.5px solid var(--border); padding-top: 7px; }
    .empty-hist { font-size: 13px; color: var(--text3); text-align: center; padding: 20px 0; }

    /* ── NEW: "logging for past date" banner shown below header ── */
    .past-date-banner {
      display: none;
      margin: 10px 14px 0;
      padding: 10px 14px;
      background: var(--amber-light, #FAEEDA);
      border: 0.5px solid var(--amber);
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--amber);
      align-items: center;
      gap: 8px;
    }
    .past-date-banner.show { display: flex; }
    .past-date-banner svg { width: 14px; height: 14px; stroke: var(--amber); flex-shrink: 0; }
  </style>
</head>
<body>
<div class="app">

  <!-- ── Header ── -->
  <header class="header">
    <div class="header-top">
      <div class="app-title">Climbing <em>App</em></div>

      <!--
        NEW: The date badge is now a button.
        Tapping it toggles the date picker panel open/closed.
        The pencil icon hints that it's editable.
      -->
      <div class="date-badge" id="date-badge" onclick="toggleDatePicker()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        <span id="date-label"></span>
      </div>
    </div>
    <div class="header-meta">
      <div class="week-tag" id="week-tag"></div>
      <div class="streak-dots" id="streak-dots"></div>
    </div>
  </header>

  <!--
    NEW: Date picker panel — hidden by default.
    Uses a native <input type="date"> so the phone's own
    date picker UI appears (no custom calendar needed).
    Confirm button calls setSelectedDate() to apply the choice.
  -->
  <div class="date-picker-panel" id="date-picker-panel">
    <label for="date-input">Logging for:</label>
    <input type="date" id="date-input" onchange="previewDate(this.value)" />
    <button class="date-confirm-btn" onclick="confirmDate()">Set date</button>
  </div>

  <!--
    NEW: Amber warning banner — only visible when logging for a past date.
    Reminds you which date you're filling in so you don't accidentally
    overwrite the wrong entry.
  -->
  <div class="past-date-banner" id="past-banner">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="past-banner-text"></span>
  </div>

  <!-- Climbing today? -->
  <div class="section">
    <div class="section-head">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      Climbing today?
    </div>
    <div class="climb-btns">
      <button class="cbtn" id="btn-yes" onclick="setClimb('yes')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2C8 2 4 6 4 10c0 6 8 12 8 12s8-6 8-12c0-4-4-8-8-8z"/><circle cx="12" cy="10" r="2"/></svg>
        Climbing
      </button>
      <button class="cbtn" id="btn-no" onclick="setClimb('no')">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 9V7a2 2 0 00-2-2H4a2 2 0 00-2 2v6a2 2 0 002 2h8"/><path d="M16 14l2 2 4-4"/></svg>
        Rest day
      </button>
    </div>
  </div>

  <!-- Recovery -->
  <div class="section">
    <div class="section-head">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 3a6 6 0 009 9 9 9 0 11-9-9z"/></svg>
      Recovery
    </div>
    <div class="field">
      <div class="field-top">
        <span class="field-name">Sleep</span>
        <span class="field-val" id="sleep-val">7h</span>
      </div>
      <input type="range" id="sleep" min="2" max="12" step="0.5" value="7" oninput="updSleep(this.value)">
    </div>
    <div class="field">
      <div class="field-top">
        <span class="field-name">Water</span>
        <span class="field-val" id="water-val">2.0L</span>
      </div>
      <input type="range" id="water" min="0" max="5" step="0.25" value="2" oninput="updWater(this.value)">
    </div>
  </div>

  <!-- Energy -->
  <div class="section">
    <div class="section-head">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Energy
    </div>
    <div class="field">
      <div class="field-top">
        <span class="field-name">Physical</span>
        <span class="field-val" id="phys-val">5</span>
      </div>
      <div class="energy-track" id="phys-track">
        <input type="range" id="phys" min="1" max="10" step="1" value="5" oninput="updEnergy('phys',this.value)">
      </div>
    </div>
    <div class="field">
      <div class="field-top">
        <span class="field-name">Mental</span>
        <span class="field-val" id="ment-val">5</span>
      </div>
      <div class="energy-track" id="ment-track">
        <input type="range" id="ment" min="1" max="10" step="1" value="5" oninput="updEnergy('ment',this.value)">
      </div>
    </div>
  </div>

  <!-- Nutrition (optional) -->
  <div class="section">
    <div class="section-head">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2a10 10 0 100 20A10 10 0 0012 2z"/><path d="M12 6v6l4 2"/></svg>
      Nutrition <span class="opt-tag">optional</span>
    </div>
    <div class="two-col">
      <div>
        <div class="field-top" style="margin-bottom:6px;"><span class="field-name" style="font-size:13px;">Calories</span></div>
        <div class="input-wrap">
          <input type="number" id="cals" placeholder="2200" min="0" max="9999">
          <span class="unit">kcal</span>
        </div>
      </div>
      <div>
        <div class="field-top" style="margin-bottom:6px;"><span class="field-name" style="font-size:13px;">Protein</span></div>
        <div class="input-wrap">
          <input type="number" id="prot" placeholder="150" min="0" max="999">
          <span class="unit">g</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Notes -->
  <div class="section">
    <div class="section-head">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Notes
    </div>
    <textarea id="notes" placeholder="e.g. 'felt strong on the overhang' or 'slept awfully, work stress'"></textarea>
  </div>

  <!-- Save -->
  <div class="save-wrap">
    <button class="save-btn" onclick="saveEntry()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Log entry
    </button>
    <div class="toast" id="toast">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="toast-msg">Entry saved!</span>
    </div>
  </div>

  <!-- History toggle -->
  <div class="hist-toggle-wrap">
    <button class="hist-toggle" onclick="toggleHist()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
      <span id="hist-lbl">Show log history</span>
    </button>
  </div>

  <!-- History panel -->
  <div class="hist-panel" id="hist-panel">
    <button class="export-btn" onclick="exportCSV()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export CSV for coach
    </button>
    <div id="hist-list"></div>
  </div>

</div><!-- end .app -->

<script>
  /* ============================================================
     CONSTANTS & STATE
     STORAGE_KEY: the key under which all entries are saved in
     localStorage — like a filename for our persistent dict.
     selectedDate: tracks which date the user is currently logging
     for. Defaults to today but can be changed via the date picker.
  ============================================================ */
  const STORAGE_KEY = 'climbing_app_v1';
  let climbVal     = null;
  let selectedDate = todayStr(); // NEW: tracks the active logging date

  /* ============================================================
     UTILITY: todayStr()
     Returns today's date as a string in YYYY-MM-DD format.
     This format is used as the unique key for each entry —
     like a dict key — so entries for the same date overwrite
     each other rather than duplicating.
  ============================================================ */
  function todayStr() {
    return new Date().toISOString().split('T')[0];
  }

  /* ============================================================
     UTILITY: formatDisplayDate(dateStr)
     NEW function. Takes a YYYY-MM-DD string and returns a
     human-readable label like "Fri 5 Jun".
     The 'T12:00:00' trick forces noon local time so the date
     doesn't shift by a day due to timezone offsets.
  ============================================================ */
  function formatDisplayDate(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  }

  /* ============================================================
     DATA HELPERS: getEntries() / saveEntries()
     localStorage stores everything as strings, so we use
     JSON.stringify/parse to convert our array of entry objects
     to/from text — equivalent to json.dumps/loads in Python.
  ============================================================ */
  function getEntries() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch(e) { return []; }
  }
  function saveEntries(arr) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  }

  /* ============================================================
     DATE PICKER FUNCTIONS (all NEW)

     toggleDatePicker(): shows/hides the date picker panel.
     previewDate(): updates the header label as you scroll
       through dates in the picker (before confirming).
     confirmDate(): applies the chosen date as selectedDate,
       updates the UI, and pre-fills any existing entry for
       that date so you can edit it.
  ============================================================ */

  function toggleDatePicker() {
    const panel = document.getElementById('date-picker-panel');
    const isOpen = panel.classList.contains('open');
    if (isOpen) {
      panel.classList.remove('open');
    } else {
      // Set the picker's value to the currently selected date before opening
      document.getElementById('date-input').value = selectedDate;
      panel.classList.add('open');
    }
  }

  function previewDate(val) {
    // Live-update the header label as the user scrolls the date picker
    if (val) document.getElementById('date-label').textContent = formatDisplayDate(val);
  }

  function confirmDate() {
    const val = document.getElementById('date-input').value;
    if (!val) return;

    selectedDate = val;
    document.getElementById('date-picker-panel').classList.remove('open');
    updateDateUI();
    prefillForm(selectedDate);
  }

  /* ============================================================
     updateDateUI()
     NEW helper. Refreshes all the date-dependent UI:
     - Header date label
     - The amber "logging for past date" banner
     - The save button label
  ============================================================ */
  function updateDateUI() {
    const isToday = selectedDate === todayStr();
    const isPast  = selectedDate < todayStr();

    // Update header badge label
    document.getElementById('date-label').textContent = formatDisplayDate(selectedDate);

    // Show amber warning banner if logging for a past date
    const banner = document.getElementById('past-banner');
    if (isPast) {
      document.getElementById('past-banner-text').textContent =
        `Logging for ${formatDisplayDate(selectedDate)} — existing entry will be updated`;
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
  }

  /* ============================================================
     prefillForm(dateStr)
     NEW version of the old init() pre-fill logic, but now
     accepts any date rather than always using today.
     Looks up whether an entry exists for that date and
     populates all the form fields if so — so you can edit
     a past entry without losing what you already entered.
  ============================================================ */
  function prefillForm(dateStr) {
    const prev = getEntries().find(e => e.date === dateStr);

    // Reset form to defaults first
    document.getElementById('sleep').value = 7;  updSleep(7);
    document.getElementById('water').value = 2;  updWater(2);
    document.getElementById('phys').value  = 5;  updEnergy('phys', 5);
    document.getElementById('ment').value  = 5;  updEnergy('ment', 5);
    document.getElementById('cals').value  = '';
    document.getElementById('prot').value  = '';
    document.getElementById('notes').value = '';
    climbVal = null;
    document.getElementById('btn-yes').className = 'cbtn';
    document.getElementById('btn-no').className  = 'cbtn';

    // If an entry exists for this date, overwrite defaults with saved values
    if (prev) {
      document.getElementById('sleep').value = prev.sleep; updSleep(prev.sleep);
      document.getElementById('water').value = prev.water; updWater(prev.water);
      document.getElementById('phys').value  = prev.physical; updEnergy('phys', prev.physical);
      document.getElementById('ment').value  = prev.mental;   updEnergy('ment', prev.mental);
      if (prev.calories) document.getElementById('cals').value = prev.calories;
      if (prev.protein)  document.getElementById('prot').value = prev.protein;
      if (prev.notes)    document.getElementById('notes').value = prev.notes;
      if (prev.climbing) setClimb(prev.climbing);
    }
  }

  /* ============================================================
     SLIDER UPDATE FUNCTIONS
     Called via oninput on each slider — updates the displayed
     value label in real time as the thumb is dragged.
  ============================================================ */

  function updSleep(v) {
    document.getElementById('sleep-val').textContent =
      parseFloat(v).toFixed(1).replace('.0','') + 'h';
  }

  function updWater(v) {
    document.getElementById('water-val').textContent =
      parseFloat(v).toFixed(2).replace(/0$/,'').replace(/\.$/,'') + 'L';
  }

  /* updEnergy: also colours the slider track and value label
     green (7-10), amber (4-6), or red (1-3) */
  function updEnergy(id, v) {
    const n   = parseInt(v);
    const col = n >= 7 ? 'var(--green)' : n >= 4 ? 'var(--amber)' : 'var(--red)';
    document.getElementById(id+'-val').textContent  = n;
    document.getElementById(id+'-val').style.color  = col;
    const pct = ((n - 1) / 9 * 100).toFixed(1) + '%';
    document.getElementById(id+'-track').querySelector('input').style.background =
      `linear-gradient(to right, ${col} 0%, ${col} ${pct}, var(--surface2) ${pct})`;
  }

  /* ============================================================
     setClimb(val)
     Stores the climb/rest choice in the climbVal variable and
     updates the button styles to show which is selected.
  ============================================================ */
  function setClimb(val) {
    climbVal = val;
    document.getElementById('btn-yes').className = 'cbtn' + (val === 'yes' ? ' sel-yes' : '');
    document.getElementById('btn-no').className  = 'cbtn' + (val === 'no'  ? ' sel-no'  : '');
  }

  /* ============================================================
     saveEntry()
     Collects all form values into an entry object (like a dict),
     removes any existing entry for the same date, prepends the
     new entry to the array, and saves back to localStorage.
     Uses selectedDate (NEW) rather than hardcoded todayStr().
  ============================================================ */
  function saveEntry() {
    const entry = {
      date:     selectedDate,           // NEW: uses selectedDate not todayStr()
      climbing: climbVal,
      sleep:    parseFloat(document.getElementById('sleep').value),
      water:    parseFloat(document.getElementById('water').value),
      physical: parseInt(document.getElementById('phys').value),
      mental:   parseInt(document.getElementById('ment').value),
      calories: document.getElementById('cals').value  || null,
      protein:  document.getElementById('prot').value  || null,
      notes:    document.getElementById('notes').value.trim() || null
    };

    // Filter out any existing entry for this date, then add the new one at the top
    const arr = getEntries().filter(e => e.date !== selectedDate);
    arr.unshift(entry);

    // Sort by date descending so history is always newest-first
    arr.sort((a, b) => b.date.localeCompare(a.date));

    saveEntries(arr);

    // Show the toast confirmation message briefly
    const toast    = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-msg');
    toastMsg.textContent = selectedDate === todayStr()
      ? 'Entry saved!'
      : `Entry saved for ${formatDisplayDate(selectedDate)}`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);

    renderStreak();
    if (document.getElementById('hist-panel').style.display === 'block') renderHist();
  }

  /* ============================================================
     renderStreak()
     Draws the 12 dots in the header — one per day going back
     12 days. Green = logged, outlined = today not yet logged,
     grey = missed. Uses a Set for O(1) lookups.
  ============================================================ */
  function renderStreak() {
    const logged = new Set(getEntries().map(e => e.date));
    const bar    = document.getElementById('streak-dots');
    const today  = todayStr();
    bar.innerHTML = '';
    for (let i = 11; i >= 0; i--) {
      const d  = new Date(); d.setDate(d.getDate() - i);
      const ds = d.toISOString().split('T')[0];
      const dot = document.createElement('div');
      dot.title = ds;
      if      (logged.has(ds))  dot.className = 'dot on';
      else if (ds === today)    dot.className = 'dot today-empty';
      else                      dot.className = 'dot';
      bar.appendChild(dot);
    }
  }

  /* ============================================================
     toggleHist() / renderHist()
     toggleHist: shows/hides the history panel.
     renderHist: builds the list of entry cards from localStorage.
     Template literals (backtick strings) build the HTML for
     each card — similar to f-strings in Python.
  ============================================================ */
  function toggleHist() {
    const p    = document.getElementById('hist-panel');
    const open = p.style.display === 'block';
    p.style.display = open ? 'none' : 'block';
    document.getElementById('hist-lbl').textContent = open ? 'Show log history' : 'Hide log history';
    if (!open) renderHist();
  }

  function renderHist() {
    const entries = getEntries();
    const list    = document.getElementById('hist-list');
    if (!entries.length) {
      list.innerHTML = '<p class="empty-hist">No entries yet — log today first!</p>';
      return;
    }
    list.innerHTML = entries.slice(0, 30).map(e => {
      const icon = e.climbing === 'yes' ? '🧗' : e.climbing === 'no' ? '💤' : '';
      return `<div class="entry-card">
        <div class="entry-date">${icon} ${formatDisplayDate(e.date)}</div>
        <div class="entry-stats">
          <div class="estat">Sleep <b>${e.sleep}h</b></div>
          <div class="estat">Water <b>${e.water}L</b></div>
          <div class="estat">Physical <b>${e.physical}/10</b></div>
          <div class="estat">Mental <b>${e.mental}/10</b></div>
          ${e.calories ? `<div class="estat">Cals <b>${e.calories}</b></div>` : ''}
          ${e.protein  ? `<div class="estat">Protein <b>${e.protein}g</b></div>` : ''}
        </div>
        ${e.notes ? `<div class="entry-note">"${e.notes}"</div>` : ''}
      </div>`;
    }).join('');
  }

  /* ============================================================
     exportCSV()
     Converts the entries array to a CSV string and triggers
     a file download. The filename includes today's date so
     you always know when it was exported.
     Notes are wrapped in quotes to handle any commas inside them.
  ============================================================ */
  function exportCSV() {
    const entries = getEntries();
    if (!entries.length) { alert('No entries to export yet!'); return; }

    const headers = ['date','climbing','sleep_h','water_L','physical_energy','mental_energy','calories_kcal','protein_g','notes'];
    const rows    = entries.map(e => [
      e.date, e.climbing||'', e.sleep, e.water,
      e.physical, e.mental, e.calories||'', e.protein||'',
      '"' + (e.notes||'').replace(/"/g,"'") + '"'
    ]);

    const csv  = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'climbing_log_' + todayStr() + '.csv';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  /* ============================================================
     init()
     Runs once when the page loads. Sets up the date display,
     calculates the training week, renders the streak dots,
     and pre-fills the form with today's entry if one exists.
  ============================================================ */
  function init() {
    // Set the header date label to today on load
    document.getElementById('date-label').textContent = formatDisplayDate(selectedDate);

    // Week counter — reads training start date from localStorage if set,
    // otherwise falls back to a default. We'll make this user-editable in
    // a future branch (feature/training-start-date).
    const startStr = localStorage.getItem('training_start') || '2026-09-01';
    const START    = new Date(startStr + 'T12:00:00');
    const now      = new Date();
    const diff     = Math.floor((now - START) / (1000*60*60*24*7));
    const wk       = Math.max(1, Math.min(12, diff + 1));
    document.getElementById('week-tag').textContent = `Week ${wk} of 12`;

    renderStreak();

    // Pre-fill with today's entry if it exists
    prefillForm(selectedDate);
    updEnergy('phys', document.getElementById('phys').value);
    updEnergy('ment', document.getElementById('ment').value);
  }

  init();
</script>
